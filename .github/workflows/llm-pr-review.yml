name: PR Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  SONAR_PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}

